<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <title>CMD Manager</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="logo" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 64 64"><rect x="3" y="3" width="58" height="58" rx="13" fill="#FFFFFF" stroke="#0F172A" stroke-width="5"/><path d="M14 22l10 10-10 10" fill="none" stroke="#06B6D4" stroke-width="6" stroke-linecap="square"/><path d="M36 14V40a6 6 0 0 0 6 6h7M29 24H48" fill="none" stroke="#2563EB" stroke-width="6.5"/></svg></span>
        <span class="brand-name"><b>CMD</b> Manager</span>
      </div>
      <span class="tb-sep" aria-hidden="true"></span>
      <div class="tb-status">
        <span id="summary" class="muted small"></span>
        <span id="runChip" class="run-chip hidden"><span class="dot"></span><span id="runChipText"></span></span>
        <span id="adminBadge" class="admin-chip hidden" title="App đang chạy với quyền Administrator"><span data-icon="shield"></span>Admin</span>
      </div>
      <div class="tb-drag" aria-hidden="true"></div>
      <div class="top-actions">
        <button id="btnImport" type="button" class="btn" aria-label="Nhập" title="Nhập dữ liệu từ file JSON"><span data-icon="upload"></span><span class="lbl">Nhập</span></button>
        <button id="btnExport" type="button" class="btn" aria-label="Xuất" title="Xuất toàn bộ lệnh và danh mục ra file JSON"><span data-icon="download"></span><span class="lbl">Xuất</span></button>
        <button id="btnNew" type="button" class="btn primary" title="Tạo lệnh mới (Ctrl+N)" aria-label="Tạo lệnh mới"><span data-icon="plus"></span><span class="lbl">Tạo lệnh mới</span><kbd class="lbl">Ctrl N</kbd></button>
      </div>
    </header>

    <div class="body">
      <aside class="sidebar">
        <div class="side-top">
          <label class="search">
            <span data-icon="search"></span>
            <input id="search" type="search" placeholder="Tìm lệnh…" aria-label="Tìm lệnh">
          </label>
          <div id="filters" class="filters" role="group" aria-label="Lọc theo trạng thái"></div>
        </div>
        <div class="side-head">
          <span>Danh mục</span>
          <div class="side-head-actions">
            <button id="btnToggleAll" type="button" class="icon-btn ghost sm" title="Thu gọn tất cả danh mục" aria-label="Thu gọn tất cả danh mục"><span data-icon="chevrons"></span></button>
            <button id="btnCats" type="button" class="icon-btn ghost sm" title="Quản lý danh mục" aria-label="Quản lý danh mục"><span data-icon="plus"></span></button>
          </div>
        </div>
        <div id="groups" class="groups"></div>
        <footer id="sideFoot" class="side-foot hidden">
          <span class="foot-info"><span class="dot pulse" style="background:#58A6FF"></span><span id="runningCount"></span></span>
          <button id="btnStopAll" type="button" class="btn xs danger"><span data-icon="stop"></span>Tắt tất cả</button>
        </footer>
      </aside>

      <main id="detail" class="detail"></main>
    </div>
  </div>

  <div id="modalRoot"></div>
  <div id="toasts" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
